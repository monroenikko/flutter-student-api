version: "3"
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: flutter-student-api-app
        container_name: student-api-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        environment:
            DB_HOST: host.docker.internal
            DB_PORT: 3306
        networks:
            - student-api-network

    web:
        image: nginx:alpine
        container_name: student-api-web
        restart: unless-stopped
        ports:
            - "8090:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - student-api-network
        depends_on:
            - app

    db:
        image: mysql:8.0
        container_name: student-api-db
        restart: unless-stopped
        ports:
            - "33066:3306"
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-temp_sjai072026}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
            MYSQL_ROOT_HOST: "%"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - student-api-network

networks:
    student-api-network:
        driver: bridge

volumes:
    dbdata:
        driver: local
